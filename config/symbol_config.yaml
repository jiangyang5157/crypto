# ═══════════════════════════════════════════════════════════════════════════
# SYMBOL CONFIG — Per-instrument trading parameters and strategy overrides
# ═══════════════════════════════════════════════════════════════════════════
# Each symbol block defines execution precision AND optional overrides.
# Overrides deep-merge on top of the corresponding base config section at
# resolve time. The override structure mirrors the original config structure
# exactly (e.g., overrides.regime_parameters matches strategy_config.yaml's
# regime_parameters section).
#
# Config resolution order: base config + symbol.overrides → resolved
# Evolution patching: overrides first, then base config

XAUTUSDT:
  precision_qty: 3
  precision_price: 1
  min_order_qty: 0.01
  sl_slippage_buffer: 1

  overrides: 
    trade_management:
      net_qty_tolerance: 0.0001
    risk_management:
      min_rr_ranging: 1.0
      min_rr_trending: 1.1
      stop_loss_buffer_min: 1.6
      structural_buffer_atr: 1.0
      max_entry_distance_atr: 0.7
    regime_parameters:
      trend:
        trend_intensity_threshold: 0.25
        trend_intensity_strong: 0.6   # 演化提案 26.8.22 XAUT：base 0.4→0.6，过滤边缘趋势跟随，减少超买浅回调 DLE 过早止损
      structural:
        breakout_frontrun_atr: 0.2
        poc_gravity_atr_distance: 0.8
      micro_sentiment:
        cvd_intensity_threshold: 0.20   # 从 0.25 降下来。XAUT |CVD| P75=0.15, P90=0.18，0.25 已是 P95 太保守。对齐 P85 作为"显著"基准
        cvd_intensity_extreme: 0.36   # 统一到低簇边界。XAUT |CVD| 双峰：低簇 0.07-0.36 / 高簇 0.62-0.74。0.36 正好卡边界，对齐 sniper cvd_extreme_threshold。
    sniper:
      probes:
        squeeze_trigger_multiplier: 1.3   # 从 base 0.75 调高。XAUT squeeze_factor 天然 1.2-1.5，base 0.75 永远不触发。1.0×1.3=1.3，sf<1.3 时触发。
      signal_stack:
        trigger_threshold: 0.34
        thresholds:
          cvd_divergence_tick_delta: 0.12   # 从 0.18 降低。XAUT CVD 变动幅度小(0.02-0.10/脉冲)，0.18 太高导致背离检测器火灾率仅 1%。
          cvd_extreme_threshold: 0.24   # 从 0.36 降低。0.36 卡在低簇边界，Path B 仅在高簇(0.62+)触发。0.24 让极端路径在 |cvd|>0.24 时即生效，双路径互补。
          large_trade_zscore: 1.6
        cooldown:
          stacked_break_count: 4
        gate:
          min_active_non_trend: 2   # 从 3 降回 2。XAUT 双信号触发频繁，放宽到 ≥2 个同向信号即放行，在非趋势行情保留更多 wake。
          min_active_trend: 1

BTCUSDT:
  precision_qty: 4           # Decimal places for order quantity
  precision_price: 1         # Decimal places for order price
  min_order_qty: 0.001       # Fallback safety quantity if delta is zero
  sl_slippage_buffer: 10.0   # SL Limit offset from Trigger

  overrides:
    trade_management:
      net_qty_tolerance: 0.00001
    risk_management:
      min_rr_ranging: 1.1
      min_rr_trending: 1.2
      stop_loss_buffer_min: 1.4
      structural_buffer_atr: 1.0
      max_entry_distance_atr: 0.6
    regime_parameters:
      trend:
        trend_intensity_min_expansion: 0.12 # 波动扩张期间提高趋势强度门槛，过滤假突破噪声。
      volume:
        vacuum_risk_score: 0.5
      imbalance:
        long_short_imbalance_ratio: 2.0
      structural:
        breakout_frontrun_atr: 0.08
        poc_gravity_atr_distance: 3.2
      micro_sentiment:
        cvd_intensity_threshold: 0.14   # 0.08-0.12
        cvd_intensity_extreme: 0.16     # 0.14-0.18
    sniper:
      signal_stack:
        trigger_threshold: 0.36   # 从 base 0.34 调高。连续抬高 confluence 门槛压弱信号噪声/降 AI 成本。注：实测 BTC weak wake 多落在 0.38-0.41，0.36 仅提供 0.34-0.36 安全垫，若要切掉 0.38-0.41 那批需 ≥0.42。
        thresholds:
          cvd_divergence_tick_delta: 0.08   # 从 0.25 降低。BTC CVD 在 0.001-0.05 范围微动，0.25 永远达不到。0.08 仍远超正常噪声(~0.02)，只在方向突变时触发。
          cvd_extreme_threshold: 0.18 # 适配 BTC 高流动性低噪声
          large_trade_zscore: 2.0 # BTC 实测 Z=3-4，经常触发，够了
        cooldown:
          stacked_break_count: 4   # 提到 4 防止 ranging 40min cooldown 形同虚设。
        gate:
          min_active_non_trend: 2   # 从 3 降回 2。BTC 72% wakes 在 ranging，45% 是单信号，71% 结果 NEUTRAL。≥2 同向信号才放行，降低 LLM 浪费。
          min_active_trend: 1
